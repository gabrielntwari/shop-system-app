<style>
.rc-wrap{max-width:1200px;margin:0 auto}
.rc-grid{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.rc-main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:20px}
.rc-side{flex:1 1 330px;min-width:0;display:flex;flex-direction:column;gap:16px}
.rc-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px 24px}
.rc-card h2{margin:0 0 6px;font-size:17px;color:#111827}
.rc-hint{margin:0 0 14px;font-size:13px;color:#6b7280}
.rc-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.rc-f{display:flex;flex-direction:column;gap:6px}
.rc-f label{font-size:13px;font-weight:600;color:#374151}
.rc input,.rc select,.rc textarea{padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;width:100%;box-sizing:border-box}
.rc input:focus,.rc select:focus,.rc textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.rc-btn{display:block;text-align:center;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;width:100%;box-sizing:border-box}
.rc-btn:hover{background:#1d4ed8}
.rc-btn2{display:inline-block;padding:11px 18px;border:1px solid #d1d5db;background:#fff;color:#111827;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.rc-btn2:hover{background:#f3f4f6}
.rc-pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700}
.rc-pill.ok{background:#eff6ff;color:#1d4ed8}
.rc-pill.due{background:#fff7ed;color:#9a3412}

.rc-table .r{text-align:right}
.rc-kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.rc-kv:last-child{border-bottom:0}
.rc-kv span{color:#6b7280}
.rc-links a{color:#1d4ed8;text-decoration:none;font-weight:600}
