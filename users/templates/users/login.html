{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GNT Partners</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body >

<div class="login-page" >

    <div class="login-card">

        <div class="login-logo">

            <img
                src="{% static 'images/gnt_partners_icon.png' %}"
                alt="GNT Partners Ltd"
                style="height: 60px; width: auto; object-fit: contain; margin-bottom: 8px;">

            <h1>GNT Partners</h1>

            <p>Sign in to continue</p>

        </div>


        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>

    </div>

</div>

<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
